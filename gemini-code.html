<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>私人 YouTube 播放清單整理庫</title>
<style>
  :root{
    --bg: #17150f;
    --surface: #221f18;
    --surface-2: #2b271d;
    --card-line: #46402f;
    --ink: #efe7d6;
    --ink-dim: #b3a98f;
    --stamp: #d99a3c;
    --stamp-dim: #8a6a30;
    --sage: #7c9b7a;
    --danger: #c1594a;
    --radius: 3px;
    --serif: Georgia, 'Noto Serif TC', 'PMingLiU', serif;
    --mono: ui-monospace, 'SFMono-Regular', 'Menlo', 'Consolas', 'Noto Sans Mono TC', monospace;
    --sans: -apple-system, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
  }
  a{color:inherit;}

  /* ---------- header / catalog rail ---------- */
  header.top{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--card-line);
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--stamp);
  }
  header.top h1{
    margin:0;
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(22px,4vw,32px);
    letter-spacing:.01em;
  }

  main{
    max-width:1080px;
    margin:0 auto;
    padding:24px 20px 80px;
  }

  /* ---------- API key ledger card ---------- */
  .ledger{
    background:var(--surface);
    border:1px solid var(--card-line);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:28px;
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:center;
    justify-content:space-between;
    position:relative;
  }
  .ledger::before{
    content:"";
    position:absolute;
    left:0; top:10px; bottom:10px;
    width:3px;
    background:var(--stamp-dim);
  }
  .ledger-label{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.08em;
    color:var(--ink-dim);
    text-transform:uppercase;
  }
  .ledger-status{
    font-family:var(--mono);
    font-size:13px;
    padding:3px 10px;
    border-radius:20px;
    border:1px solid var(--card-line);
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .ledger-status.on{ color:#0f150e; background:var(--sage); border-color:var(--sage); }
  .ledger-status.off{ color:var(--ink-dim); }
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .ledger-actions{ display:flex; gap:10px; flex-wrap:wrap; }

  button{
    font-family:var(--sans);
    font-size:13px;
    border:1px solid var(--card-line);
    background:var(--surface-2);
    color:var(--ink);
    padding:8px 14px;
    border-radius:var(--radius);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  button:hover{ border-color:var(--stamp); }
  button:focus-visible, input:focus-visible{
    outline:2px solid var(--stamp);
    outline-offset:2px;
  }
  button.primary{ background:var(--stamp); border-color:var(--stamp); color:#1a1408; font-weight:600; }
  button.primary:hover{ background:#e6ab52; }
  button.ghost{ background:transparent; }
  button.danger{ color:var(--danger); }
  button:disabled{ opacity:.4; cursor:not-allowed; }

  input[type=text]{
    font-family:var(--mono);
    font-size:13px;
    background:var(--surface-2);
    border:1px solid var(--card-line);
    color:var(--ink);
    padding:9px 12px;
    border-radius:var(--radius);
    width:100%;
  }

  /* ---------- add playlist strip ---------- */
  .add-row{
    display:flex;
    gap:10px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .add-row input{ flex:1; min-width:220px; }

  .msg{
    font-family:var(--mono);
    font-size:12.5px;
    padding:8px 12px;
    border-radius:var(--radius);
    margin-bottom:18px;
    border:1px solid var(--card-line);
  }
  .msg.error{ color:var(--danger); border-color:var(--danger); background:rgba(193,89,74,.08); }
  .msg.info{ color:var(--sage); border-color:var(--sage); background:rgba(124,155,122,.08); }

  .section-title{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-title::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--card-line);
  }

  /* ---------- playlist card catalog ---------- */
  .catalog{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--card-line);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .card.dragging{ opacity:.35; }
  .card.drag-over{ border-color:var(--stamp); box-shadow:0 0 0 1px var(--stamp) inset; }
  .drag-handle{
    cursor:grab;
    color:var(--ink-dim);
    font-family:var(--mono);
    font-size:15px;
    letter-spacing:2px;
    padding:0 2px;
    user-select:none;
    flex-shrink:0;
    align-self:stretch;
    display:flex;
    align-items:center;
  }
  .drag-handle:active{ cursor:grabbing; }
  .card-tab{
    position:absolute;
    top:0; right:16px;
    background:var(--stamp);
    color:#1a1408;
    font-family:var(--mono);
    font-size:11px;
    font-weight:700;
    padding:3px 9px 4px;
    border-radius:0 0 4px 4px;
    letter-spacing:.05em;
  }
  .card-body{
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .card-info{ flex:1; min-width:200px; }
  .card-title{
    font-family:var(--serif);
    font-size:17px;
    line-height:1.3;
    margin:0 0 4px;
    padding-right:60px;
  }
  .card-meta{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--ink-dim);
  }
  .card-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    flex-shrink:0;
    align-items:center;
  }
  .confirm-text{
    font-family:var(--mono);
    font-size:12px;
    color:var(--danger);
  }

  /* ---------- expanded video list ---------- */
  .video-list{
    border-top:1px solid var(--card-line);
    max-height:340px;
    overflow-y:auto;
  }
  .video-row{
    display:flex;
    gap:10px;
    padding:9px 14px;
    border-bottom:1px solid var(--card-line);
    cursor:pointer;
    align-items:center;
  }
  .video-row:hover{ background:var(--surface-2); }
  .video-row img{
    width:74px;
    aspect-ratio:16/9;
    object-fit:cover;
    border-radius:2px;
    flex-shrink:0;
    background:var(--surface-2);
  }
  .video-row .vi{ min-width:0; }
  .video-row .vt{
    font-size:13px;
    line-height:1.3;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .video-row .vc{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    margin-top:3px;
  }
  .video-row .vn{
    font-family:var(--mono);
    font-size:11px;
    color:var(--stamp-dim);
    width:26px;
    flex-shrink:0;
    text-align:right;
  }

  .empty{
    font-family:var(--mono);
    font-size:13px;
    color:var(--ink-dim);
    padding:40px 20px;
    text-align:center;
    border:1px dashed var(--card-line);
    border-radius:var(--radius);
  }

  /* ---------- player view ---------- */
  .player-view{ display:none; }
  .player-view.active{ display:block; }
  .catalog-view.hidden{ display:none; }

  .back-link{
    background:var(--surface);
    border:1px solid var(--card-line);
    color:var(--stamp);
    font-family:var(--mono);
    font-size:13px;
    font-weight:600;
    padding:12px 22px;
    border-radius:var(--radius);
    cursor:pointer;
    margin-bottom:18px;
    display:inline-block;
  }
  .back-link:hover{ border-color:var(--stamp); background:var(--surface-2); text-decoration:none; }

  .stage{
    background:var(--surface);
    border:1px solid var(--card-line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .player-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
  }
  .player-wrap iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0;
  }
  .player-toprow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    padding:16px 18px;
    border-bottom:1px solid var(--card-line);
  }
  .player-titleblock{ min-width:200px; flex:1; }
  .player-titleblock h2{
    font-family:var(--serif);
    font-size:19px;
    margin:0 0 4px;
    line-height:1.3;
  }
  .player-titleblock .pc{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-dim);
  }
  .player-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    flex-shrink:0;
  }
  .player-controls .count{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--ink-dim);
    min-width:80px;
    text-align:center;
  }
  .player-playlist{
    max-height:400px;
    overflow-y:auto;
  }
  .video-row.current{
    background:rgba(217,154,60,.12);
    border-left:2px solid var(--stamp);
  }

  body.player-mode header.top,
  body.player-mode .ledger{
    display:none;
  }
  body.player-mode main{
    padding-top:24px;
  }
  footer.note{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    text-align:center;
    padding:30px 20px 10px;
  }

  @media (max-width:600px){
    .catalog{ grid-template-columns:1fr; }
    .ledger{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="eyebrow">Personal Archive · No Server Required</div>
  <h1>私人 YouTube 播放清單整理庫</h1>
</header>

<main id="mainEl">

  <!-- API KEY LEDGER -->
  <div class="ledger">
    <div>
      <div class="ledger-label">YouTube API Key</div>
      <div id="keyStatus" class="ledger-status off"><span class="dot"></span><span>尚未匯入 API Key</span></div>
    </div>
    <div class="ledger-actions">
      <button class="primary" id="btnImportKey">匯入 TXT</button>
      <button class="ghost" id="btnClearKey">清除 API Key</button>
      <input type="file" id="fileKey" accept=".txt,text/plain" style="display:none">
    </div>
  </div>

  <div id="globalMsg"></div>

  <!-- ADD PLAYLIST -->
  <div class="catalog-view" id="catalogView">
    <div class="add-row">
      <input type="text" id="playlistInput" placeholder="貼上 YouTube 播放清單網址或 Playlist ID">
      <button class="primary" id="btnAddPlaylist">新增 Playlist</button>
    </div>

    <h2 class="section-title">典藏清單
      <button id="btnRefreshAll" class="ghost" style="margin-left:auto;">重新整理典藏清單</button>
    </h2>
    <div id="catalog" class="catalog"></div>
  </div>

  <!-- PLAYER VIEW -->
  <div class="player-view" id="playerView">
    <button class="back-link" id="btnBack">← 返回總清單列表</button>
    <div class="stage">
      <div class="player-wrap">
        <div id="ytPlayer"></div>
      </div>
      <div class="player-toprow">
        <div class="player-titleblock">
          <h2 id="npTitle">—</h2>
          <div class="pc" id="npChannel">—</div>
        </div>
        <div class="player-controls">
          <button id="btnPrev">上一部</button>
          <span class="count" id="npCount">第 0 / 0 部</span>
          <button id="btnNext">下一部</button>
        </div>
      </div>
      <div class="player-playlist" id="playerPlaylist"></div>
    </div>
  </div>

  <footer class="note">API Key 僅存在於本次瀏覽的記憶體中，關閉或重新整理頁面後即消失。Playlist 資料保存於本機瀏覽器 localStorage。</footer>
</main>

<script>
(function(){
  "use strict";

  /* ================= state ================= */
  let youtubeApiKey = "";               // memory-only, never persisted
  let playlists = loadPlaylists();      // [{id,title,thumbnail,videos:[...]}]
  let currentPlaylistId = null;
  let currentIndex = 0;
  let ytPlayerObj = null;
  let ytApiReady = false;
  let pendingLoad = null;

  const $ = (sel) => document.querySelector(sel);
  const el = {
    keyStatus: $("#keyStatus"),
    btnImportKey: $("#btnImportKey"),
    btnClearKey: $("#btnClearKey"),
    fileKey: $("#fileKey"),
    globalMsg: $("#globalMsg"),
    playlistInput: $("#playlistInput"),
    btnAddPlaylist: $("#btnAddPlaylist"),
    catalog: $("#catalog"),
    catalogView: $("#catalogView"),
    playerView: $("#playerView"),
    btnBack: $("#btnBack"),
    npTitle: $("#npTitle"),
    npChannel: $("#npChannel"),
    npCount: $("#npCount"),
    btnPrev: $("#btnPrev"),
    btnNext: $("#btnNext"),
    mainEl: $("#mainEl"),
    playerPlaylist: $("#playerPlaylist"),
  };

  /* ================= API key handling (memory only) ================= */

  function setKeyStatus(imported){
    if(imported){
      el.keyStatus.className = "ledger-status on";
      el.keyStatus.innerHTML = '<span class="dot"></span><span>API Key 已匯入</span>';
    } else {
      el.keyStatus.className = "ledger-status off";
      el.keyStatus.innerHTML = '<span class="dot"></span><span>尚未匯入 API Key</span>';
    }
  }

  function showMsg(text, type){
    el.globalMsg.innerHTML = '<div class="msg ' + (type||"info") + '">' + escapeHtml(text) + '</div>';
    if(type !== "error"){
      setTimeout(()=>{ if(el.globalMsg.firstChild && el.globalMsg.firstChild.textContent.includes(text)) el.globalMsg.innerHTML = ""; }, 4000);
    }
  }

  el.btnImportKey.addEventListener("click", () => el.fileKey.click());

  el.fileKey.addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // reset so same file can be re-selected later
    if(!file) return;

    const nameOk = /\.txt$/i.test(file.name) || file.type === "text/plain";
    if(!nameOk){
      showMsg("請選擇 TXT 格式的 API Key 檔案。", "error");
      return;
    }

    try{
      const content = await file.text();
      const cleaned = content.replace(/\r/g, "").replace(/\n/g, "").trim().replace(/\s+/g, "");
      if(!cleaned){
        showMsg("TXT 檔案沒有 API Key。", "error");
        return;
      }
      youtubeApiKey = cleaned;
      setKeyStatus(true);
      showMsg("API Key 已匯入", "info");
    }catch(err){
      showMsg("讀取 TXT 檔案時發生錯誤。", "error");
    }
  });

  el.btnClearKey.addEventListener("click", () => {
    youtubeApiKey = "";
    setKeyStatus(false);
    showMsg("API Key 已清除。", "info");
  });

  // page load / reload always starts empty — nothing to restore
  setKeyStatus(false);

  /* ================= localStorage: playlists only ================= */

  function loadPlaylists(){
    try{
      const raw = localStorage.getItem("yt_playlists");
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }
  function savePlaylists(){
    localStorage.setItem("yt_playlists", JSON.stringify(playlists));
  }

  /* ================= parsing playlist / video ids ================= */

  function parsePlaylistId(input){
    input = input.trim();
    if(!input) return null;
    try{
      const url = new URL(input);
      const list = url.searchParams.get("list");
      if(list) return list;
    }catch(e){
      // not a URL, fall through
    }
    // raw ID heuristics: playlist ids typically start with PL, UU, FL, LL, RD, OL etc.
    if(/^[A-Za-z0-9_-]{10,}$/.test(input)) return input;
    return null;
  }

  function parseVideoId(input){
    input = input.trim();
    try{
      const url = new URL(input);
      if(url.hostname.includes("youtu.be")) return url.pathname.slice(1);
      const v = url.searchParams.get("v");
      if(v) return v;
    }catch(e){}
    if(/^[A-Za-z0-9_-]{11}$/.test(input)) return input;
    return null;
  }

  /* ================= YouTube Data API calls ================= */

  async function apiFetch(endpoint, params){
    if(!youtubeApiKey){
      showMsg("請先匯入 YouTube API Key。", "error");
      return null;
    }
    const url = new URL("https://www.googleapis.com/youtube/v3/" + endpoint);
    Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
    url.searchParams.set("key", youtubeApiKey);

    let res;
    try{
      res = await fetch(url.toString());
    }catch(e){
      showMsg("YouTube API 請求失敗，請檢查網路連線。", "error");
      return null;
    }
    if(!res.ok){
      if(res.status === 400 || res.status === 401 || res.status === 403){
        showMsg("API Key 無效或 YouTube API 尚未啟用。", "error");
      } else {
        showMsg("YouTube API 請求失敗。", "error");
      }
      return null;
    }
    try{
      return await res.json();
    }catch(e){
      showMsg("YouTube API 回應格式錯誤。", "error");
      return null;
    }
  }

  async function fetchPlaylistMeta(playlistId){
    const data = await apiFetch("playlists", { part: "snippet", id: playlistId, maxResults: 1 });
    if(!data || !data.items || !data.items.length) return null;
    const s = data.items[0].snippet;
    return { title: s.title, thumbnail: (s.thumbnails && (s.thumbnails.medium || s.thumbnails.default) || {}).url || "" };
  }

  async function fetchAllPlaylistItems(playlistId){
    let items = [];
    let pageToken = "";
    do{
      const params = { part: "snippet,contentDetails", playlistId: playlistId, maxResults: 50 };
      if(pageToken) params.pageToken = pageToken;
      const data = await apiFetch("playlistItems", params);
      if(!data) return null;
      (data.items || []).forEach(it => {
        const sn = it.snippet || {};
        const thumb = (sn.thumbnails && (sn.thumbnails.medium || sn.thumbnails.default) || {}).url || "";
        const title = sn.title || "";
        // skip videos removed by the uploader (or otherwise unavailable)
        if(/^(Deleted video|Private video)$/i.test(title.trim())) return;
        items.push({
          videoId: (it.contentDetails && it.contentDetails.videoId) || (sn.resourceId && sn.resourceId.videoId) || "",
          title: title,
          channel: sn.videoOwnerChannelTitle || sn.channelTitle || "",
          thumbnail: thumb,
          position: sn.position
        });
      });
      pageToken = data.nextPageToken || "";
    } while(pageToken);
    return items;
  }

  /* ================= add playlist flow ================= */

  el.btnAddPlaylist.addEventListener("click", addPlaylist);
  el.playlistInput.addEventListener("keydown", (e) => { if(e.key === "Enter") addPlaylist(); });
  $("#btnRefreshAll").addEventListener("click", refreshAllPlaylists);

  async function refreshAllPlaylists(){
    if(!youtubeApiKey){
      showMsg("請先匯入 YouTube API Key。", "error");
      return;
    }
    if(!playlists.length){
      showMsg("目前沒有可以重新整理的 Playlist。", "info");
      return;
    }
    const btn = $("#btnRefreshAll");
    btn.disabled = true;

    for(let i = 0; i < playlists.length; i++){
      const p = playlists[i];
      btn.textContent = "重新整理中 (" + (i+1) + "/" + playlists.length + ")…";

      const meta = await fetchPlaylistMeta(p.id);
      if(!meta) continue; // keep old data for this playlist if it fails, move on to next

      const videos = await fetchAllPlaylistItems(p.id);
      if(!videos) continue;

      p.title = meta.title;
      p.thumbnail = meta.thumbnail;
      p.videos = videos;
      // position in the playlists array (and thus display order) is left untouched
      savePlaylists();
      renderCatalog();
    }

    btn.disabled = false;
    btn.textContent = "重新整理典藏清單";
    showMsg("典藏清單已重新整理完成。", "info");
  }

  async function addPlaylist(){
    if(!youtubeApiKey){
      showMsg("請先匯入 YouTube API Key。", "error");
      return;
    }
    const raw = el.playlistInput.value;
    const playlistId = parsePlaylistId(raw);
    if(!playlistId){
      showMsg("無法解析 Playlist ID，請確認網址或 ID 是否正確。", "error");
      return;
    }

    el.btnAddPlaylist.disabled = true;
    el.btnAddPlaylist.textContent = "取得中…";

    const meta = await fetchPlaylistMeta(playlistId);
    if(!meta){
      el.btnAddPlaylist.disabled = false;
      el.btnAddPlaylist.textContent = "新增 Playlist";
      return;
    }

    const videos = await fetchAllPlaylistItems(playlistId);
    el.btnAddPlaylist.disabled = false;
    el.btnAddPlaylist.textContent = "新增 Playlist";
    if(!videos) return;

    const existingIdx = playlists.findIndex(p => p.id === playlistId);
    const record = { id: playlistId, title: meta.title, thumbnail: meta.thumbnail, videos: videos, expanded: false };
    if(existingIdx >= 0) playlists[existingIdx] = record;
    else playlists.unshift(record);

    savePlaylists();
    el.playlistInput.value = "";
    showMsg('已取得「' + meta.title + '」共 ' + videos.length + ' 部影片。', "info");
    renderCatalog();
  }

  /* ================= catalog rendering ================= */

  function renderCatalog(){
    if(!playlists.length){
      el.catalog.innerHTML = '<div class="empty">尚未收錄任何 Playlist。貼上網址即可開始典藏。</div>';
      return;
    }
    el.catalog.innerHTML = "";
    playlists.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";

      card.draggable = true;
      card.dataset.id = p.id;
      card.innerHTML =
        '<div class="card-tab">' + p.videos.length + ' 部</div>' +
        '<div class="card-body">' +
          '<span class="drag-handle" title="拖曳以調整順序">⋮⋮</span>' +
          '<div class="card-info">' +
            '<h3 class="card-title">' + escapeHtml(p.title) + '</h3>' +
            '<div class="card-meta">Playlist ID: ' + escapeHtml(p.id) + '</div>' +
          '</div>' +
          '<div class="card-actions">' +
            '<button class="expandBtn">' + (p.expanded ? "收合" : "展開") + '</button>' +
            '<button class="playBtn primary">播放</button>' +
            '<button class="deleteBtn danger ghost">刪除</button>' +
          '</div>' +
        '</div>';

      const expandBtn = card.querySelector(".expandBtn");
      const deleteBtn = card.querySelector(".deleteBtn");
      const actionsRow = card.querySelector(".card-actions");
      card.querySelector(".playBtn").addEventListener("click", () => openPlayer(p.id, 0));
      deleteBtn.addEventListener("click", () => {
        actionsRow.innerHTML =
          '<span class="confirm-text">確定要刪除「' + escapeHtml(p.title) + '」嗎？</span>' +
          '<button class="confirmDeleteBtn danger">確認刪除</button>' +
          '<button class="cancelDeleteBtn ghost">取消</button>';
        actionsRow.querySelector(".confirmDeleteBtn").addEventListener("click", () => deletePlaylist(p.id));
        actionsRow.querySelector(".cancelDeleteBtn").addEventListener("click", () => renderCatalog());
      });
      expandBtn.addEventListener("click", () => {
        p.expanded = !p.expanded;
        expandBtn.textContent = p.expanded ? "收合" : "展開";
        const existingList = card.querySelector(".video-list");
        if(p.expanded && !existingList){
          card.appendChild(buildVideoList(p));
        } else if(!p.expanded && existingList){
          existingList.remove();
        }
      });

      if(p.expanded){
        card.appendChild(buildVideoList(p));
      }

      attachDragHandlers(card);
      el.catalog.appendChild(card);
    });
  }

  /* ---- drag & drop reordering ---- */
  function attachDragHandlers(card){
    card.addEventListener("dragstart", (e) => {
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", card.dataset.id);
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      el.catalog.querySelectorAll(".card.drag-over").forEach(c => c.classList.remove("drag-over"));
    });
    card.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      if(!card.classList.contains("dragging")) card.classList.add("drag-over");
    });
    card.addEventListener("dragleave", () => {
      card.classList.remove("drag-over");
    });
    card.addEventListener("drop", (e) => {
      e.preventDefault();
      card.classList.remove("drag-over");
      const draggedId = e.dataTransfer.getData("text/plain");
      const targetId = card.dataset.id;
      if(!draggedId || draggedId === targetId) return;
      reorderPlaylists(draggedId, targetId);
    });
  }

  function reorderPlaylists(draggedId, targetId){
    const fromIdx = playlists.findIndex(p => p.id === draggedId);
    const toIdx = playlists.findIndex(p => p.id === targetId);
    if(fromIdx === -1 || toIdx === -1) return;
    const [moved] = playlists.splice(fromIdx, 1);
    playlists.splice(toIdx, 0, moved);
    savePlaylists();
    renderCatalog();
  }

  function buildVideoList(p){
    const list = document.createElement("div");
    list.className = "video-list";
    p.videos.forEach((v, idx) => {
      const row = document.createElement("div");
      row.className = "video-row";
      row.innerHTML =
        '<span class="vn">' + (idx+1) + '</span>' +
        (v.thumbnail ? '<img src="' + attr(v.thumbnail) + '" alt="">' : '<img alt="">') +
        '<div class="vi"><div class="vt">' + escapeHtml(v.title) + '</div><div class="vc">' + escapeHtml(v.channel) + '</div></div>';
      row.addEventListener("click", () => openPlayer(p.id, idx));
      list.appendChild(row);
    });
    return list;
  }

  function deletePlaylist(playlistId){
    playlists = playlists.filter(p => p.id !== playlistId);
    savePlaylists();
    renderCatalog();
  }

  /* ================= player view ================= */

  function loadYouTubeIframeApi(){
    if(window.YT && window.YT.Player){ ytApiReady = true; return; }
    if(document.getElementById("ytIframeApiScript")) return;
    const tag = document.createElement("script");
    tag.id = "ytIframeApiScript";
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  }
  window.onYouTubeIframeAPIReady = function(){
    ytApiReady = true;
    if(pendingLoad){
      const v = pendingLoad;
      pendingLoad = null;
      createOrLoadPlayer(v);
    }
  };

  function createOrLoadPlayer(videoId){
    if(!ytApiReady || !window.YT || !window.YT.Player){
      pendingLoad = videoId;
      return;
    }
    if(ytPlayerObj){
      ytPlayerObj.loadVideoById(videoId);
      return;
    }
    ytPlayerObj = new YT.Player("ytPlayer", {
      videoId: videoId,
      playerVars: {
        autoplay: 1,
        enablejsapi: 1,
        origin: window.location.origin,
        playsinline: 1
      },
      events: {
        onStateChange: (event) => {
          if(event.data === YT.PlayerState.ENDED){
            playNext();
          }
        }
      }
    });
  }

  function openPlayer(playlistId, index){
    const p = playlists.find(pl => pl.id === playlistId);
    if(!p || !p.videos.length) return;
    currentPlaylistId = playlistId;
    currentIndex = Math.max(0, Math.min(index, p.videos.length - 1));

    el.catalogView.classList.add("hidden");
    el.playerView.classList.add("active");
    document.body.classList.add("player-mode");

    loadYouTubeIframeApi();
    renderNowPlaying();
    createOrLoadPlayer(p.videos[currentIndex].videoId);
  }

  function renderNowPlaying(){
    const p = playlists.find(pl => pl.id === currentPlaylistId);
    if(!p) return;
    const v = p.videos[currentIndex];
    el.npTitle.textContent = v.title;
    el.npChannel.textContent = v.channel;
    el.npCount.textContent = "第 " + (currentIndex+1) + " / " + p.videos.length + " 部";
    el.btnPrev.disabled = currentIndex <= 0;
    el.btnNext.disabled = currentIndex >= p.videos.length - 1;

    el.playerPlaylist.innerHTML = "";
    p.videos.forEach((vid, idx) => {
      const row = document.createElement("div");
      row.className = "video-row" + (idx === currentIndex ? " current" : "");
      row.innerHTML =
        '<span class="vn">' + (idx+1) + '</span>' +
        (vid.thumbnail ? '<img src="' + attr(vid.thumbnail) + '" alt="">' : '<img alt="">') +
        '<div class="vi"><div class="vt">' + escapeHtml(vid.title) + '</div><div class="vc">' + escapeHtml(vid.channel) + '</div></div>';
      row.addEventListener("click", () => {
        currentIndex = idx;
        renderNowPlaying();
        createOrLoadPlayer(vid.videoId);
      });
      el.playerPlaylist.appendChild(row);
    });
  }

  function playNext(){
    const p = playlists.find(pl => pl.id === currentPlaylistId);
    if(!p) return;
    if(currentIndex < p.videos.length - 1){
      currentIndex++;
      renderNowPlaying();
      createOrLoadPlayer(p.videos[currentIndex].videoId);
    }
  }
  function playPrev(){
    if(currentIndex > 0){
      currentIndex--;
      const p = playlists.find(pl => pl.id === currentPlaylistId);
      renderNowPlaying();
      createOrLoadPlayer(p.videos[currentIndex].videoId);
    }
  }

  el.btnNext.addEventListener("click", playNext);
  el.btnPrev.addEventListener("click", playPrev);
  el.btnBack.addEventListener("click", () => {
    el.playerView.classList.remove("active");
    el.catalogView.classList.remove("hidden");
    document.body.classList.remove("player-mode");
    if(ytPlayerObj && ytPlayerObj.stopVideo) ytPlayerObj.stopVideo();
    renderCatalog();
  });

  /* ================= utils ================= */

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
  function attr(str){ return escapeHtml(str); }

  /* ================= init ================= */
  renderCatalog();

})();
</script>
</body>
</html>
