<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>私人 YouTube 播放清單整理庫</title>
<style>
  :root{
    --bg: #17150f;
    --surface: #221f18;
    --surface-2: #2b271d;
    --card-line: #46402f;
    --ink: #efe7d6;
    --ink-dim: #b3a98f;
    --stamp: #d99a3c;
    --stamp-dim: #8a6a30;
    --sage: #7c9b7a;
    --danger: #c1594a;
    --radius: 3px;
    --serif: Georgia, 'Noto Serif TC', 'PMingLiU', serif;
    --mono: ui-monospace, 'SFMono-Regular', 'Menlo', 'Consolas', 'Noto Sans Mono TC', monospace;
    --sans: -apple-system, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
  }
  a{color:inherit;}

  /* ---------- header / catalog rail ---------- */
  header.top{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--card-line);
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--stamp);
  }
  header.top h1{
    margin:0;
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(22px,4vw,32px);
    letter-spacing:.01em;
  }

  main{
    max-width:1080px;
    margin:0 auto;
    padding:24px 20px 80px;
  }

  /* ---------- API key ledger card ---------- */
  .ledger{
    background:var(--surface);
    border:1px solid var(--card-line);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:28px;
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:center;
    justify-content:space-between;
    position:relative;
  }
  .ledger::before{
    content:"";
    position:absolute;
    left:0; top:10px; bottom:10px;
    width:3px;
    background:var(--stamp-dim);
  }
  .ledger-label{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.08em;
    color:var(--ink-dim);
    text-transform:uppercase;
  }
  .ledger-status{
    font-family:var(--mono);
    font-size:13px;
    padding:3px 10px;
    border-radius:20px;
    border:1px solid var(--card-line);
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .ledger-status.on{ color:#0f150e; background:var(--sage); border-color:var(--sage); }
  .ledger-status.off{ color:var(--ink-dim); }
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .ledger-actions{ display:flex; gap:10px; flex-wrap:wrap; }

  button{
    font-family:var(--sans);
    font-size:13px;
    border:1px solid var(--card-line);
    background:var(--surface-2);
    color:var(--ink);
    padding:8px 14px;
    border-radius:var(--radius);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  button:hover{ border-color:var(--stamp); }
  button:focus-visible, input:focus-visible{
    outline:2px solid var(--stamp);
    outline-offset:2px;
  }
  button.primary{ background:var(--stamp); border-color:var(--stamp); color:#1a1408; font-weight:600; }
  button.primary:hover{ background:#e6ab52; }
  button.ghost{ background:transparent; }
  button.danger{ color:var(--danger); }
  button:disabled{ opacity:.4; cursor:not-allowed; }

  input[type=text]{
    font-family:var(--mono);
    font-size:13px;
    background:var(--surface-2);
    border:1px solid var(--card-line);
    color:var(--ink);
    padding:9px 12px;
    border-radius:var(--radius);
    width:100%;
  }

  /* ---------- add playlist strip ---------- */
  .add-row{
    display:flex;
    gap:10px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .add-row input{ flex:1; min-width:220px; }

  .msg{
    font-family:var(--mono);
    font-size:12.5px;
    padding:8px 12px;
    border-radius:var(--radius);
    margin-bottom:18px;
    border:1px solid var(--card-line);
  }
  .msg.error{ color:var(--danger); border-color:var(--danger); background:rgba(193,89,74,.08); }
  .msg.info{ color:var(--sage); border-color:var(--sage); background:rgba(124,155,122,.08); }

  .section-title{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-title::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--card-line);
  }

  .section-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin:0 0 14px;
    padding-bottom:10px;
    border-bottom:1px solid var(--card-line);
  }
  .section-title-left{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .section-label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  button.small{ padding:6px 12px; font-size:12.5px; }
  #btnMultiSelect.active{ border-color:var(--stamp); color:var(--stamp); }

  /* ---------- multi-select ---------- */
  .card-select{
    display:flex;
    align-items:center;
    flex-shrink:0;
  }
  .card-select input[type=checkbox],
  .video-row .row-checkbox{
    width:16px;
    height:16px;
    accent-color:var(--stamp);
    cursor:pointer;
  }
  .card.selected{ border-color:var(--stamp); box-shadow:0 0 0 1px var(--stamp) inset; }
  .video-row.selected{ background:rgba(217,154,60,.1); }

  /* ---------- rename ---------- */
  .card-edit-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
    flex:1;
    min-width:200px;
  }
  .card-edit-row input[type=text]{ flex:1; min-width:160px; }

  /* ---------- per-video delete / drag ---------- */
  .video-row{ position:relative; }
  .video-row .delete-video-btn{
    background:none;
    border:none;
    color:var(--ink-dim);
    font-size:15px;
    line-height:1;
    padding:4px 6px;
    cursor:pointer;
    flex-shrink:0;
    margin-left:auto;
  }
  .video-row .delete-video-btn:hover{ color:var(--danger); }
  .video-row.dragging-video{ opacity:.35; }
  .video-list.video-drop-target{ outline:1px dashed var(--stamp); outline-offset:-2px; }

  /* ---------- playlist card catalog ---------- */
  .catalog{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--card-line);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .card.dragging{ opacity:.35; }
  .card.drag-over{ border-color:var(--stamp); box-shadow:0 0 0 1px var(--stamp) inset; }
  .drag-handle{
    cursor:grab;
    color:var(--ink-dim);
    font-family:var(--mono);
    font-size:15px;
    letter-spacing:2px;
    padding:0 2px;
    user-select:none;
    flex-shrink:0;
    align-self:stretch;
    display:flex;
    align-items:center;
  }
  .drag-handle:active{ cursor:grabbing; }
  .card-tab{
    position:absolute;
    top:0; right:16px;
    background:var(--stamp);
    color:#1a1408;
    font-family:var(--mono);
    font-size:11px;
    font-weight:700;
    padding:3px 9px 4px;
    border-radius:0 0 4px 4px;
    letter-spacing:.05em;
  }
  .card-body{
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .card-info{ flex:1; min-width:200px; }
  .card-title{
    font-family:var(--serif);
    font-size:17px;
    line-height:1.3;
    margin:0 0 4px;
    padding-right:60px;
    cursor:text;
  }
  .card-title.editing{
    padding-right:0;
  }
  .card-title-input{
    width:100%;
    font-family:var(--serif);
    font-size:17px;
    line-height:1.3;
    background:var(--surface-2);
    border:1px solid var(--stamp);
    color:var(--ink);
    padding:4px 7px;
    border-radius:var(--radius);
  }
  .card-meta{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--ink-dim);
  }
  .card-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    flex-shrink:0;
    align-items:center;
  }
  .confirm-text{
    font-family:var(--mono);
    font-size:12px;
    color:var(--danger);
  }

  /* ---------- expanded video list ---------- */
  .video-list{
    border-top:1px solid var(--card-line);
    max-height:340px;
    overflow-y:auto;
  }
  .video-row{
    display:flex;
    gap:10px;
    padding:9px 14px;
    border-bottom:1px solid var(--card-line);
    cursor:pointer;
    align-items:center;
  }
  .video-row:hover{ background:var(--surface-2); }
  .video-row img{
    width:74px;
    aspect-ratio:16/9;
    object-fit:cover;
    border-radius:2px;
    flex-shrink:0;
    background:var(--surface-2);
  }
  .video-row .vi{ min-width:0; }
  .video-row .vt{
    font-size:13px;
    line-height:1.3;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .video-row .vc{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    margin-top:3px;
  }
  .video-row .vn{
    font-family:var(--mono);
    font-size:11px;
    color:var(--stamp-dim);
    width:26px;
    flex-shrink:0;
    text-align:right;
  }

  .empty{
    font-family:var(--mono);
    font-size:13px;
    color:var(--ink-dim);
    padding:40px 20px;
    text-align:center;
    border:1px dashed var(--card-line);
    border-radius:var(--radius);
  }

  /* ---------- player view ---------- */
  .player-view{ display:none; }
  .player-view.active{ display:block; }
  .catalog-view.hidden{ display:none; }

  .back-link{
    background:var(--surface);
    border:1px solid var(--card-line);
    color:var(--stamp);
    font-family:var(--mono);
    font-size:13px;
    font-weight:600;
    padding:12px 22px;
    border-radius:var(--radius);
    cursor:pointer;
    margin-bottom:18px;
    display:inline-block;
  }
  .back-link:hover{ border-color:var(--stamp); background:var(--surface-2); text-decoration:none; }

  .stage{
    background:var(--surface);
    border:1px solid var(--card-line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .player-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
  }
  .player-wrap iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0;
  }
  .player-toprow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    padding:16px 18px;
    border-bottom:1px solid var(--card-line);
  }
  .player-titleblock{ min-width:200px; flex:1; }
  .player-titleblock h2{
    font-family:var(--serif);
    font-size:19px;
    margin:0 0 4px;
    line-height:1.3;
  }
  .player-titleblock .pc{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-dim);
  }
  .player-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    flex-shrink:0;
  }
  .player-controls .count{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--ink-dim);
    min-width:80px;
    text-align:center;
  }
  .player-playlist{
    max-height:400px;
    overflow-y:auto;
  }
  .video-row.current{
    background:rgba(217,154,60,.12);
    border-left:2px solid var(--stamp);
  }

  body.player-mode header.top,
  body.player-mode .ledger{
    display:none;
  }
  body.player-mode main{
    padding-top:24px;
  }
  /* ---------- single video -> custom playlist modal ---------- */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,9,6,.72);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
  }
  .modal-overlay.active{ display:flex; }
  .modal-box{
    background:var(--surface);
    border:1px solid var(--card-line);
    border-radius:var(--radius);
    width:100%;
    max-width:440px;
    max-height:86vh;
    overflow-y:auto;
    padding:22px 22px 18px;
  }
  .modal-title{
    font-family:var(--serif);
    font-size:18px;
    margin:0 0 14px;
  }
  .modal-video-preview{
    display:flex;
    gap:10px;
    align-items:center;
    background:var(--surface-2);
    border:1px solid var(--card-line);
    border-radius:var(--radius);
    padding:8px;
    margin-bottom:18px;
  }
  .modal-video-preview img{
    width:100px;
    aspect-ratio:16/9;
    object-fit:cover;
    border-radius:2px;
    flex-shrink:0;
    background:var(--surface);
  }
  .modal-video-preview .mv-title{
    font-size:13px;
    line-height:1.35;
  }
  .modal-video-preview .mv-channel{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    margin-top:3px;
  }
  .modal-section{ margin-bottom:16px; }
  .modal-custom-list{
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:180px;
    overflow-y:auto;
  }
  .modal-custom-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border:1px solid var(--card-line);
    border-radius:var(--radius);
    padding:8px 10px;
    font-size:13px;
  }
  .modal-custom-row .mcr-name{
    font-family:var(--serif);
  }
  .modal-custom-row .mcr-count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
  }
  .modal-empty{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-dim);
  }
  .modal-new-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .modal-new-row input{ flex:1; min-width:140px; }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    border-top:1px solid var(--card-line);
    padding-top:14px;
    margin-top:4px;
  }
  .custom-tag{
    display:inline-block;
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--sage);
    border:1px solid var(--sage);
    border-radius:20px;
    padding:1px 7px;
    margin-left:8px;
    letter-spacing:.03em;
  }

  footer.note{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    text-align:center;
    padding:30px 20px 10px;
  }

  @media (max-width:600px){
    .catalog{ grid-template-columns:1fr; }
    .ledger{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="eyebrow">Personal Archive · No Server Required</div>
  <h1>私人 YouTube 播放清單整理庫</h1>
</header>

<main id="mainEl">

  <!-- API KEY LEDGER -->
  <div class="ledger">
    <div>
      <div class="ledger-label">YouTube API Key</div>
      <div id="keyStatus" class="ledger-status off"><span class="dot"></span><span>尚未匯入 API Key</span></div>
    </div>
    <div class="ledger-actions">
      <button class="primary" id="btnImportKey">匯入 TXT</button>
      <button class="ghost" id="btnClearKey">清除 API Key</button>
      <input type="file" id="fileKey" accept=".txt,text/plain" style="display:none">
    </div>
  </div>

  <div id="globalMsg"></div>

  <!-- ADD PLAYLIST -->
  <div class="catalog-view" id="catalogView">
    <div class="add-row">
      <input type="text" id="playlistInput" placeholder="貼上 YouTube 播放清單網址或 Playlist ID">
      <button class="primary" id="btnAddPlaylist">新增 Playlist</button>
    </div>

    <h2 class="section-title-row">
      <span class="section-title-left">
        <span class="section-label">典藏清單</span>
        <button id="btnRefreshAll" class="ghost">重新整理典藏清單</button>
      </span>
      <span class="section-title-left">
        <button id="btnMultiSelect" class="ghost small">多選</button>
        <button id="btnDeleteSelected" class="ghost small danger" style="display:none;">刪除選取項目</button>
      </span>
    </h2>
    <div id="catalog" class="catalog"></div>
  </div>

  <!-- PLAYER VIEW -->
  <div class="player-view" id="playerView">
    <button class="back-link" id="btnBack">← 返回總清單列表</button>
    <div class="stage">
      <div class="player-wrap">
        <div id="ytPlayer"></div>
      </div>
      <div class="player-toprow">
        <div class="player-titleblock">
          <h2 id="npTitle">—</h2>
          <div class="pc" id="npChannel">—</div>
        </div>
        <div class="player-controls">
          <button id="btnPrev">上一部</button>
          <span class="count" id="npCount">第 0 / 0 部</span>
          <button id="btnNext">下一部</button>
        </div>
      </div>
      <div class="player-playlist" id="playerPlaylist"></div>
    </div>
  </div>

  <footer class="note">API Key 僅存在於本次瀏覽的記憶體中，關閉或重新整理頁面後即消失。Playlist 資料保存於本機瀏覽器 localStorage。</footer>
</main>

<!-- SINGLE VIDEO -> ADD TO CUSTOM PLAYLIST MODAL -->
<div class="modal-overlay" id="videoModal">
  <div class="modal-box">
    <h3 class="modal-title">新增單一部影片</h3>
    <div class="modal-video-preview" id="modalVideoPreview"></div>

    <div class="modal-section">
      <div class="section-title">加入現有自訂清單</div>
      <div id="modalCustomList" class="modal-custom-list"></div>
    </div>

    <div class="modal-section">
      <div class="section-title">或建立新的自訂清單</div>
      <div class="modal-new-row">
        <input type="text" id="modalNewListName" placeholder="輸入新自訂清單名稱">
        <button class="primary" id="modalCreateBtn">建立並加入</button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="ghost" id="modalCancelBtn">取消</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ================= state ================= */
  let youtubeApiKey = "";               // memory-only, never persisted
  let playlists = loadPlaylists();      // [{id,title,thumbnail,videos:[...]}]
  let currentPlaylistId = null;
  let currentIndex = 0;
  let ytPlayerObj = null;
  let ytApiReady = false;
  let pendingLoad = null;

  const $ = (sel) => document.querySelector(sel);
  const el = {
    keyStatus: $("#keyStatus"),
    btnImportKey: $("#btnImportKey"),
    btnClearKey: $("#btnClearKey"),
    fileKey: $("#fileKey"),
    globalMsg: $("#globalMsg"),
    playlistInput: $("#playlistInput"),
    btnAddPlaylist: $("#btnAddPlaylist"),
    catalog: $("#catalog"),
    catalogView: $("#catalogView"),
    playerView: $("#playerView"),
    btnBack: $("#btnBack"),
    npTitle: $("#npTitle"),
    npChannel: $("#npChannel"),
    npCount: $("#npCount"),
    btnPrev: $("#btnPrev"),
    btnNext: $("#btnNext"),
    mainEl: $("#mainEl"),
    playerPlaylist: $("#playerPlaylist"),
    videoModal: $("#videoModal"),
    modalVideoPreview: $("#modalVideoPreview"),
    modalCustomList: $("#modalCustomList"),
    modalNewListName: $("#modalNewListName"),
    modalCreateBtn: $("#modalCreateBtn"),
    modalCancelBtn: $("#modalCancelBtn"),
    btnMultiSelect: $("#btnMultiSelect"),
    btnDeleteSelected: $("#btnDeleteSelected"),
  };
  let pendingVideoMeta = null;
  let multiSelectMode = false;
  let selectedPlaylistIds = new Set();
  let selectedVideoKeys = new Set(); // `${playlistId}::${videoId}`

  /* ================= API key handling (memory only) ================= */

  function setKeyStatus(imported){
    if(imported){
      el.keyStatus.className = "ledger-status on";
      el.keyStatus.innerHTML = '<span class="dot"></span><span>API Key 已匯入</span>';
    } else {
      el.keyStatus.className = "ledger-status off";
      el.keyStatus.innerHTML = '<span class="dot"></span><span>尚未匯入 API Key</span>';
    }
  }

  function showMsg(text, type){
    el.globalMsg.innerHTML = '<div class="msg ' + (type||"info") + '">' + escapeHtml(text) + '</div>';
    if(type !== "error"){
      setTimeout(()=>{ if(el.globalMsg.firstChild && el.globalMsg.firstChild.textContent.includes(text)) el.globalMsg.innerHTML = ""; }, 4000);
    }
  }

  el.btnImportKey.addEventListener("click", () => el.fileKey.click());

  el.fileKey.addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // reset so same file can be re-selected later
    if(!file) return;

    const nameOk = /\.txt$/i.test(file.name) || file.type === "text/plain";
    if(!nameOk){
      showMsg("請選擇 TXT 格式的 API Key 檔案。", "error");
      return;
    }

    try{
      const content = await file.text();
      const cleaned = content.replace(/\r/g, "").replace(/\n/g, "").trim().replace(/\s+/g, "");
      if(!cleaned){
        showMsg("TXT 檔案沒有 API Key。", "error");
        return;
      }
      youtubeApiKey = cleaned;
      setKeyStatus(true);
      showMsg("API Key 已匯入", "info");
    }catch(err){
      showMsg("讀取 TXT 檔案時發生錯誤。", "error");
    }
  });

  el.btnClearKey.addEventListener("click", () => {
    youtubeApiKey = "";
    setKeyStatus(false);

  });

  setKeyStatus(false);

  /* ================= localStorage: playlists only ================= */

  function loadPlaylists(){
    try{
      const raw = localStorage.getItem("yt_playlists");
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }
  function savePlaylists(){
    localStorage.setItem("yt_playlists", JSON.stringify(playlists));
  }

  /* ================= parsing playlist / video ids ================= */

  function parsePlaylistId(input){
    input = input.trim();
    if(!input) return null;
    try{
      const url = new URL(input);
      const list = url.searchParams.get("list");
      if(list) return list;
    }catch(e){
      // not a URL, fall through
    }
    // raw ID heuristics: playlist ids typically start with PL, UU, FL, LL, RD, OL etc.
    if(/^[A-Za-z0-9_-]{10,}$/.test(input)) return input;
    return null;
  }

  function parseVideoId(input){
    input = input.trim();
    try{
      const url = new URL(input);
      if(url.hostname.includes("youtu.be")) return url.pathname.slice(1);
      const v = url.searchParams.get("v");
      if(v) return v;
    }catch(e){}
    if(/^[A-Za-z0-9_-]{11}$/.test(input)) return input;
    return null;
  }

  /* ================= YouTube Data API calls ================= */

  async function apiFetch(endpoint, params){
    if(!youtubeApiKey){
      showMsg("請先匯入 YouTube API Key。", "error");
      return null;
    }
    const url = new URL("https://www.googleapis.com/youtube/v3/" + endpoint);
    Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
    url.searchParams.set("key", youtubeApiKey);

    let res;
    try{
      res = await fetch(url.toString());
    }catch(e){
      showMsg("YouTube API 請求失敗，請檢查網路連線。", "error");
      return null;
    }
    if(!res.ok){
      if(res.status === 400 || res.status === 401 || res.status === 403){
        showMsg("API Key 無效或 YouTube API 尚未啟用。", "error");
      } else {
        showMsg("YouTube API 請求失敗。", "error");
      }
      return null;
    }
    try{
      return await res.json();
    }catch(e){
      showMsg("YouTube API 回應格式錯誤。", "error");
      return null;
    }
  }

  async function fetchPlaylistMeta(playlistId){
    const data = await apiFetch("playlists", { part: "snippet", id: playlistId, maxResults: 1 });
    if(!data || !data.items || !data.items.length) return null;
    const s = data.items[0].snippet;
    return { title: s.title, thumbnail: (s.thumbnails && (s.thumbnails.medium || s.thumbnails.default) || {}).url || "" };
  }

  async function fetchVideoMeta(videoId){
    const data = await apiFetch("videos", { part: "snippet", id: videoId });
    if(!data || !data.items || !data.items.length){
      showMsg("找不到該影片，可能已被刪除或設為私人。", "error");
      return null;
    }
    const sn = data.items[0].snippet;
    const thumb = (sn.thumbnails && (sn.thumbnails.medium || sn.thumbnails.default) || {}).url || "";
    return { videoId: videoId, title: sn.title || "", channel: sn.channelTitle || "", thumbnail: thumb };
  }

  async function fetchAllPlaylistItems(playlistId){
    let items = [];
    let pageToken = "";
    do{
      const params = { part: "snippet,contentDetails", playlistId: playlistId, maxResults: 50 };
      if(pageToken) params.pageToken = pageToken;
      const data = await apiFetch("playlistItems", params);
      if(!data) return null;
      (data.items || []).forEach(it => {
        const sn = it.snippet || {};
        const thumb = (sn.thumbnails && (sn.thumbnails.medium || sn.thumbnails.default) || {}).url || "";
        const title = sn.title || "";
        // skip videos removed by the uploader (or otherwise unavailable)
        if(/^(Deleted video|Private video)$/i.test(title.trim())) return;
        items.push({
          videoId: (it.contentDetails && it.contentDetails.videoId) || (sn.resourceId && sn.resourceId.videoId) || "",
          title: title,
          channel: sn.videoOwnerChannelTitle || sn.channelTitle || "",
          thumbnail: thumb,
          position: sn.position
        });
      });
      pageToken = data.nextPageToken || "";
    } while(pageToken);
    return items;
  }

  /* ================= add playlist flow ================= */

  el.btnAddPlaylist.addEventListener("click", addPlaylist);
  el.playlistInput.addEventListener("keydown", (e) => { if(e.key === "Enter") addPlaylist(); });
  $("#btnRefreshAll").addEventListener("click", refreshAllPlaylists);

  async function refreshAllPlaylists(){
    if(!youtubeApiKey){
      showMsg("請先匯入 YouTube API Key。", "error");
      return;
    }
    if(!playlists.length){
      showMsg("目前沒有可以重新整理的 Playlist。", "info");
      return;
    }
    const btn = $("#btnRefreshAll");
    btn.disabled = true;

    for(let i = 0; i < playlists.length; i++){
      const p = playlists[i];
      if(p.isCustom) continue; // custom playlists have no real YouTube playlist to refresh from
      btn.textContent = "重新整理中 (" + (i+1) + "/" + playlists.length + ")…";

      const meta = await fetchPlaylistMeta(p.id);
      if(!meta) continue; // keep old data for this playlist if it fails, move on to next

      const videos = await fetchAllPlaylistItems(p.id);
      if(!videos) continue;

      p.title = meta.title;
      p.thumbnail = meta.thumbnail;
      p.videos = videos;
      // position in the playlists array (and thus display order) is left untouched
      savePlaylists();
      renderCatalog();
    }

    btn.disabled = false;
    btn.textContent = "重新整理典藏清單";
    showMsg("典藏清單已重新整理完成。", "info");
  }

  async function addPlaylist(){
    if(!youtubeApiKey){
      showMsg("請先匯入 YouTube API Key。", "error");
      return;
    }
    const raw = el.playlistInput.value;
    const playlistId = parsePlaylistId(raw);

    if(!playlistId){
      // not a playlist link/id — see if it's a single video instead
      const videoId = parseVideoId(raw);
      if(!videoId){
        showMsg("無法解析 Playlist 或影片網址，請確認網址或 ID 是否正確。", "error");
        return;
      }
      el.btnAddPlaylist.disabled = true;
      el.btnAddPlaylist.textContent = "取得中…";
      const videoMeta = await fetchVideoMeta(videoId);
      el.btnAddPlaylist.disabled = false;
      el.btnAddPlaylist.textContent = "新增 Playlist";
      if(!videoMeta) return;
      el.playlistInput.value = "";
      openVideoModal(videoMeta);
      return;
    }

    el.btnAddPlaylist.disabled = true;
    el.btnAddPlaylist.textContent = "取得中…";

    const meta = await fetchPlaylistMeta(playlistId);
    if(!meta){
      el.btnAddPlaylist.disabled = false;
      el.btnAddPlaylist.textContent = "新增 Playlist";
      return;
    }

    const videos = await fetchAllPlaylistItems(playlistId);
    el.btnAddPlaylist.disabled = false;
    el.btnAddPlaylist.textContent = "新增 Playlist";
    if(!videos) return;

    const existingIdx = playlists.findIndex(p => p.id === playlistId);
    const record = { id: playlistId, title: meta.title, thumbnail: meta.thumbnail, videos: videos, expanded: false, isCustom: false };
    if(existingIdx >= 0) playlists[existingIdx] = record;
    else playlists.unshift(record);

    savePlaylists();
    el.playlistInput.value = "";
    showMsg('已取得「' + meta.title + '」共 ' + videos.length + ' 部影片。', "info");
    renderCatalog();
  }

  /* ================= single video -> custom playlist modal ================= */

  function openVideoModal(videoMeta){

  function renderModalCustomList(){

  function addVideoToCustomPlaylist(playlistId, videoMeta){

    if(p.videos.some(v => v.videoId === videoMeta.videoId)){

    } else {

  el.modalCreateBtn.addEventListener("click", () => {

  function startInlineRename(p, titleEl){
    if(titleEl.classList.contains("editing")) return;
    const originalName = p.title;
    titleEl.classList.add("editing");
    titleEl.innerHTML = '';

    const input = document.createElement("input");
    input.type = "text";
    input.className = "card-title-input";
    input.value = originalName;
    titleEl.appendChild(input);

    let finished = false;
    const finish = (commit) => {
      if(finished) return;
      finished = true;
      document.removeEventListener("mousedown", outsideHandler, true);
      input.removeEventListener("keydown", keyHandler);
      const newName = input.value.trim();
      if(commit && newName){
        p.title = newName;
        savePlaylists();
      } else {
        p.title = originalName;
      }
      renderCatalog();
    };
    const outsideHandler = (e) => {
      if(!titleEl.contains(e.target)) finish(true);
    };
    const keyHandler = (e) => {
      if(e.key === "Enter") finish(true);
      if(e.key === "Escape") finish(false);
    };

    input.addEventListener("keydown", keyHandler);
    document.addEventListener("mousedown", outsideHandler, true);
    input.focus();
    input.select();
  }

  /* ================= catalog rendering ================= */

  function renderCatalog(){
    if(!playlists.length){
      el.catalog.innerHTML = '<div class="empty">尚未收錄任何 Playlist。貼上網址即可開始典藏。</div>';
      return;
    }
    el.catalog.innerHTML = "";
    playlists.forEach(p => {
      const card = document.createElement("div");
      card.className = "card" + (selectedPlaylistIds.has(p.id) ? " selected" : "");

      card.draggable = !multiSelectMode;
      card.dataset.id = p.id;

      const selectHtml = multiSelectMode
        ? '<span class="card-select"><input type="checkbox" class="playlistCheckbox"' + (selectedPlaylistIds.has(p.id) ? " checked" : "") + '></span>'
        : '<span class="drag-handle" title="拖曳以調整順序">⋮⋮</span>';

      card.innerHTML =
        '<div class="card-tab">' + p.videos.length + ' 部</div>' +
        '<div class="card-body">' +
          selectHtml +
          '<div class="card-info">' +
            '<h3 class="card-title">' + escapeHtml(p.title) + (p.isCustom ? '<span class="custom-tag">自訂清單</span>' : '') + '</h3>' +
            '<div class="card-meta">' + (p.isCustom ? '本機自訂清單，不會被「重新整理典藏清單」覆蓋' : 'Playlist ID: ' + escapeHtml(p.id)) + '</div>' +
          '</div>' +
          '<div class="card-actions">' +
            '<button class="expandBtn">' + (p.expanded ? "收合" : "展開") + '</button>' +
            '<button class="playBtn primary">播放</button>' +
            '<button class="deleteBtn danger ghost">刪除</button>' +
          '</div>' +
        '</div>';

      const expandBtn = card.querySelector(".expandBtn");
      const deleteBtn = card.querySelector(".deleteBtn");
      const actionsRow = card.querySelector(".card-actions");
      const cardInfo = card.querySelector(".card-info");
      const cardTitle = card.querySelector(".card-title");

      card.querySelector(".playBtn").addEventListener("click", () => openPlayer(p.id, 0));

      deleteBtn.addEventListener("click", () => {
        actionsRow.innerHTML =
          '<span class="confirm-text">確定要刪除「' + escapeHtml(p.title) + '」嗎？</span>' +
          '<button class="confirmDeleteBtn danger">確認刪除</button>' +
          '<button class="cancelDeleteBtn ghost">取消</button>';
        actionsRow.querySelector(".confirmDeleteBtn").addEventListener("click", () => deletePlaylist(p.id));
        actionsRow.querySelector(".cancelDeleteBtn").addEventListener("click", () => renderCatalog());
      });

      cardTitle.addEventListener("click", (e) => {
        if(multiSelectMode) return;
        e.stopPropagation();
        startInlineRename(p, cardTitle);
      });

      expandBtn.addEventListener("click", () => {
        p.expanded = !p.expanded;
        expandBtn.textContent = p.expanded ? "收合" : "展開";
        const existingList = card.querySelector(".video-list");
        if(p.expanded && !existingList){
          card.appendChild(buildVideoList(p));
        } else if(!p.expanded && existingList){
          existingList.remove();
        }
      });

      if(multiSelectMode){
        const checkbox = card.querySelector(".playlistCheckbox");
        checkbox.addEventListener("change", (e) => {
          if(e.target.checked){
            selectedPlaylistIds.add(p.id);
            // 勾選自訂清單時，同步勾選該清單底下的所有影片。
            if(p.isCustom){
              p.videos.forEach(v => selectedVideoKeys.add(p.id + "::" + v.videoId));
            }
          } else {
            selectedPlaylistIds.delete(p.id);
            if(p.isCustom){
              p.videos.forEach(v => selectedVideoKeys.delete(p.id + "::" + v.videoId));
            }
          }
          card.classList.toggle("selected", e.target.checked);
          // 展開的影片列需要立即反映同步後的勾選狀態。
          if(p.expanded){
            const existingList = card.querySelector(".video-list");
            if(existingList) existingList.replaceWith(buildVideoList(p));
          }
        });
        card.addEventListener("click", (e) => {
          if(e.target.closest("button, input, .drag-handle, .card-title-input")) return;
          checkbox.checked = !checkbox.checked;
          checkbox.dispatchEvent(new Event("change", { bubbles:true }));
        });
      }

      if(p.expanded){
        card.appendChild(buildVideoList(p));
      }

      attachDragHandlers(card, p);
      el.catalog.appendChild(card);
    });
  }

  /* ---- drag & drop: card reordering + moving a video between custom playlists ---- */
  function attachDragHandlers(card, p){
    card.addEventListener("dragstart", (e) => {
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", card.dataset.id);
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      el.catalog.querySelectorAll(".card.drag-over").forEach(c => c.classList.remove("drag-over"));
    });
    card.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      if(!card.classList.contains("dragging")) card.classList.add("drag-over");
    });
    card.addEventListener("dragleave", () => {
      card.classList.remove("drag-over");
    });
    card.addEventListener("drop", (e) => {
      e.preventDefault();
      card.classList.remove("drag-over");

      const videoData = e.dataTransfer.getData("application/x-video-move");
      if(videoData){
        if(!p.isCustom){
          showMsg("影片只能移動到自訂清單。", "error");
          return;
        }
        let payload;
        try{ payload = JSON.parse(videoData); }catch(err){ return; }
        moveVideoToPlaylist(payload.fromPlaylistId, payload.videoId, p.id);
        return;
      }

      const draggedId = e.dataTransfer.getData("text/plain");
      const targetId = card.dataset.id;
      if(!draggedId || draggedId === targetId) return;
      reorderPlaylists(draggedId, targetId);
    });
  }

  function reorderPlaylists(draggedId, targetId){
    const fromIdx = playlists.findIndex(p => p.id === draggedId);
    const toIdx = playlists.findIndex(p => p.id === targetId);
    if(fromIdx === -1 || toIdx === -1) return;
    const [moved] = playlists.splice(fromIdx, 1);
    playlists.splice(toIdx, 0, moved);
    savePlaylists();
    renderCatalog();
  }

  function moveVideoToPlaylist(fromPlaylistId, videoId, toPlaylistId){
    if(fromPlaylistId === toPlaylistId) return;
    const fromP = playlists.find(pl => pl.id === fromPlaylistId);
    const toP = playlists.find(pl => pl.id === toPlaylistId);
    if(!fromP || !toP || !fromP.isCustom || !toP.isCustom) return;

    const idx = fromP.videos.findIndex(v => v.videoId === videoId);
    if(idx === -1) return;
    const [video] = fromP.videos.splice(idx, 1);

    if(toP.videos.some(v => v.videoId === videoId)){
      showMsg('此影片已存在於「' + toP.title + '」中。', "info");
    } else {
      video.position = toP.videos.length;
      toP.videos.push(video);
      showMsg('已將影片移動至「' + toP.title + '」。', "info");
    }
    savePlaylists();
    renderCatalog();
  }

  function buildVideoList(p){
    const list = document.createElement("div");
    list.className = "video-list";
    p.videos.forEach((v, idx) => {
      const key = p.id + "::" + v.videoId;
      const row = document.createElement("div");
      row.className = "video-row" + (multiSelectMode && selectedVideoKeys.has(key) ? " selected" : "");

      const checkboxHtml = (multiSelectMode && p.isCustom)
        ? '<input type="checkbox" class="row-checkbox"' + (selectedVideoKeys.has(key) ? " checked" : "") + '>'
        : '<span class="vn">' + (idx+1) + '</span>';

      const deleteBtnHtml = (!multiSelectMode && p.isCustom)
        ? '<button class="delete-video-btn" title="刪除此影片">✕</button>'
        : '';

      row.innerHTML =
        checkboxHtml +
        (v.thumbnail ? '<img src="' + attr(v.thumbnail) + '" alt="">' : '<img alt="">') +
        '<div class="vi"><div class="vt">' + escapeHtml(v.title) + '</div><div class="vc">' + escapeHtml(v.channel) + '</div></div>' +
        deleteBtnHtml;

      if(multiSelectMode && p.isCustom){
        const checkbox = row.querySelector(".row-checkbox");
        checkbox.addEventListener("change", (e) => {
          if(e.target.checked) selectedVideoKeys.add(key);
          else selectedVideoKeys.delete(key);
          row.classList.toggle("selected", e.target.checked);
        });
        row.addEventListener("click", (e) => {
          // 影片列屬於清單卡片內部，但不能讓點擊冒泡成「勾選整個清單」。
          e.stopPropagation();
          if(e.target.closest("input")) return;
          checkbox.checked = !checkbox.checked;
          checkbox.dispatchEvent(new Event("change", { bubbles:true }));
        });
        checkbox.addEventListener("click", (e) => {
          // 直接點 checkbox 也不應觸發外層 card 的多選切換。
          e.stopPropagation();
        });
      } else if(!multiSelectMode){
        row.addEventListener("click", (e) => {
          if(e.target.closest(".delete-video-btn")) return;
          openPlayer(p.id, idx);
        });
        if(p.isCustom){
          row.draggable = true;
          row.addEventListener("dragstart", (e) => {
            e.stopPropagation();
            row.classList.add("dragging-video");
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("application/x-video-move", JSON.stringify({ fromPlaylistId: p.id, videoId: v.videoId }));
          });
          row.addEventListener("dragend", (e) => {
            e.stopPropagation();
            row.classList.remove("dragging-video");
          });
          const delBtn = row.querySelector(".delete-video-btn");
          delBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            deleteVideoFromPlaylist(p.id, v.videoId);
          });
        }
      }

      list.appendChild(row);
    });
    return list;
  }

  function deleteVideoFromPlaylist(playlistId, videoId){
    const p = playlists.find(pl => pl.id === playlistId);
    if(!p) return;
    p.videos = p.videos.filter(v => v.videoId !== videoId);
    savePlaylists();
    renderCatalog();
  }

  function deletePlaylist(playlistId){
    playlists = playlists.filter(p => p.id !== playlistId);
    selectedPlaylistIds.delete(playlistId);
    savePlaylists();
    renderCatalog();
  }

  /* ================= multi-select mode ================= */

  function bindMultiSelectButtons(){
    el.btnMultiSelect.addEventListener("click", () => {
      multiSelectMode = !multiSelectMode;
      selectedPlaylistIds.clear();
      selectedVideoKeys.clear();
      el.btnMultiSelect.textContent = multiSelectMode ? "取消多選" : "多選";
      el.btnMultiSelect.classList.toggle("active", multiSelectMode);
      el.btnDeleteSelected.style.display = multiSelectMode ? "" : "none";
      el.btnDeleteSelected.textContent = "刪除選取項目";
      renderCatalog();
    });
    el.btnDeleteSelected.addEventListener("click", handleDeleteSelectedClick);
  }

  function handleDeleteSelectedClick(){
    const playlistCount = selectedPlaylistIds.size;
    const videoCount = Array.from(selectedVideoKeys).filter(key => {
      const pid = key.split("::")[0];
      return !selectedPlaylistIds.has(pid); // avoid double-counting videos whose whole playlist is also selected
    }).length;

    if(playlistCount === 0 && videoCount === 0){
      showMsg("尚未選取任何項目。", "error");
      return;
    }

    const row = $(".section-title-left");
    row.innerHTML =
      '<span class="section-label">典藏清單</span>' +
      '<span class="confirm-text">確定要刪除 ' + playlistCount + ' 個清單、' + videoCount + ' 部影片嗎？</span>' +
      '<button id="btnBulkConfirm" class="danger small">確認刪除</button>' +
      '<button id="btnBulkCancel" class="ghost small">取消</button>';

    $("#btnBulkConfirm").addEventListener("click", performBulkDelete);
    $("#btnBulkCancel").addEventListener("click", restoreMultiSelectToolbar);
  }

  function performBulkDelete(){
    // remove whole selected playlists
    playlists = playlists.filter(p => !selectedPlaylistIds.has(p.id));

    // remove individually selected videos from playlists that are still around
    selectedVideoKeys.forEach(key => {
      const [pid, vid] = key.split("::");
      if(selectedPlaylistIds.has(pid)) return; // playlist already removed entirely
      const p = playlists.find(pl => pl.id === pid);
      if(p) p.videos = p.videos.filter(v => v.videoId !== vid);
    });

    savePlaylists();
    selectedPlaylistIds.clear();
    selectedVideoKeys.clear();
    multiSelectMode = false;

    showMsg("已刪除選取的項目。", "info");
    restoreMultiSelectToolbar();
  }

  function restoreMultiSelectToolbar(){
    const rows = document.querySelectorAll(".section-title-left");
    if(rows.length < 2) return;
    rows[0].innerHTML =
      '<span class="section-label">典藏清單</span>' +
      '<button id="btnRefreshAll" class="ghost">重新整理典藏清單</button>';
    rows[1].innerHTML =
      '<button id="btnMultiSelect" class="ghost small">多選</button>' +
      '<button id="btnDeleteSelected" class="ghost small danger" style="display:none;">刪除選取項目</button>';
    el.btnMultiSelect = $("#btnMultiSelect");
    el.btnDeleteSelected = $("#btnDeleteSelected");
    bindMultiSelectButtons();
    $("#btnRefreshAll").addEventListener("click", refreshAllPlaylists);
    renderCatalog();
  }

  bindMultiSelectButtons();

  /* ================= player view ================= */

  function loadYouTubeIframeApi(){
    if(window.YT && window.YT.Player){ ytApiReady = true; return; }
    if(document.getElementById("ytIframeApiScript")) return;
    const tag = document.createElement("script");
    tag.id = "ytIframeApiScript";
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  }
  window.onYouTubeIframeAPIReady = function(){
    ytApiReady = true;
    if(pendingLoad){
      const v = pendingLoad;
      pendingLoad = null;
      createOrLoadPlayer(v);
    }
  };

  function createOrLoadPlayer(videoId){
    if(!ytApiReady || !window.YT || !window.YT.Player){
      pendingLoad = videoId;
      return;
    }
    if(ytPlayerObj){
      ytPlayerObj.loadVideoById(videoId);
      return;
    }
    ytPlayerObj = new YT.Player("ytPlayer", {
      videoId: videoId,
      playerVars: {
        autoplay: 1,
        enablejsapi: 1,
        origin: window.location.origin,
        playsinline: 1
      },
      events: {
        onStateChange: (event) => {
          if(event.data === YT.PlayerState.ENDED){
            playNext();
          }
        }
      }
    });
  }

  function openPlayer(playlistId, index){
    const p = playlists.find(pl => pl.id === playlistId);
    if(!p || !p.videos.length) return;
    currentPlaylistId = playlistId;
    currentIndex = Math.max(0, Math.min(index, p.videos.length - 1));

    el.catalogView.classList.add("hidden");
    el.playerView.classList.add("active");
    document.body.classList.add("player-mode");

    // 切換到觀看頁面時，將視窗捲到「返回總清單列表」按鈕正下方，
    // 讓返回按鈕仍位於視線上方，而播放器從按鈕下方開始顯示。
    requestAnimationFrame(() => {
      const backBottom = el.btnBack.getBoundingClientRect().bottom + window.scrollY;
      window.scrollTo({ top: backBottom, left: 0, behavior: "auto" });
    });

    loadYouTubeIframeApi();
    renderNowPlaying();
    createOrLoadPlayer(p.videos[currentIndex].videoId);
  }

  function renderNowPlaying(){
    const p = playlists.find(pl => pl.id === currentPlaylistId);
    if(!p) return;
    const v = p.videos[currentIndex];
    el.npTitle.textContent = v.title;
    el.npChannel.textContent = v.channel;
    el.npCount.textContent = "第 " + (currentIndex+1) + " / " + p.videos.length + " 部";
    el.btnPrev.disabled = currentIndex <= 0;
    el.btnNext.disabled = currentIndex >= p.videos.length - 1;

    el.playerPlaylist.innerHTML = "";
    p.videos.forEach((vid, idx) => {
      const row = document.createElement("div");
      row.className = "video-row" + (idx === currentIndex ? " current" : "");
      row.innerHTML =
        '<span class="vn">' + (idx+1) + '</span>' +
        (vid.thumbnail ? '<img src="' + attr(vid.thumbnail) + '" alt="">' : '<img alt="">') +
        '<div class="vi"><div class="vt">' + escapeHtml(vid.title) + '</div><div class="vc">' + escapeHtml(vid.channel) + '</div></div>';
      row.addEventListener("click", () => {
        currentIndex = idx;
        renderNowPlaying();
        createOrLoadPlayer(vid.videoId);
      });
      el.playerPlaylist.appendChild(row);
    });
  }

  function playNext(){
    const p = playlists.find(pl => pl.id === currentPlaylistId);
    if(!p) return;
    if(currentIndex < p.videos.length - 1){
      currentIndex++;
      renderNowPlaying();
      createOrLoadPlayer(p.videos[currentIndex].videoId);
    }
  }
  function playPrev(){
    if(currentIndex > 0){
      currentIndex--;
      const p = playlists.find(pl => pl.id === currentPlaylistId);
      renderNowPlaying();
      createOrLoadPlayer(p.videos[currentIndex].videoId);
    }
  }

  el.btnNext.addEventListener("click", playNext);
  el.btnPrev.addEventListener("click", playPrev);
  el.btnBack.addEventListener("click", () => {
    el.playerView.classList.remove("active");
    el.catalogView.classList.remove("hidden");
    document.body.classList.remove("player-mode");

    // 完整銷毀 YouTube 播放器，避免返回清單後仍在背景播放或持續占用資源。
    pendingLoad = null;
    if(ytPlayerObj && typeof ytPlayerObj.destroy === "function") {
      try{ ytPlayerObj.destroy(); }catch(e){}
    }
    ytPlayerObj = null;
    el.ytPlayer.innerHTML = "";
    currentPlaylistId = null;
    currentIndex = 0;

    renderCatalog();
  });

  /* ================= utils ================= */

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
  function attr(str){ return escapeHtml(str); }

  /* ================= init ================= */
  renderCatalog();

})();
</script>
</body>
</html>
